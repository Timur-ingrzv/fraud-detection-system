services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - ml-scorer
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: 
      - zookeeper
    networks:
      - ml-scorer
    ports:
      - "9095:9095"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9095", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ml-scorer
    restart: on-failure
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo 'Ожидание готовности Kafka...'
      while ! kafka-topics --bootstrap-server kafka:9092 --list; do
        sleep 1
      done

      echo 'Создание топиков...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic scoring --partitions 3 --replication-factor 1 --config retention.ms=604800000

      echo 'Топики успешно созданы:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    networks:
      - ml-scorer
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"

  fraud_detector:
    build: ./fraud_detector
    networks:
      - ml-scorer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully 
    environment:
      KAFKA_TRANSACTIONS_TOPIC: "transactions"
      KAFKA_SCORING_TOPIC: "scoring"
      BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TRANSACTIONS_GROUP: "ml-scorer"

  interface:
    build: ./interface
    networks:
     - ml-scorer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully 
    environment:
      POSTGRES_DB: "fraud_detections"
      POSTGRES_TABLE: "scores"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123456"
      POSTGRES_HOST: "database"
      POSTGRES_PORT: "5432"
      
      KAFKA_TRANSACTIONS_TOPIC: "transactions"
      BOOTSTRAP_SERVERS: "kafka:9092"

      NUM_FRAUD_TRANSACTIONS": 10
      NUM_LAST_TRANSACTIONS: 100
    ports:
     - "8501:8501"
  
  database:
    build: ./database
    networks:
      - ml-scorer
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "fraud_detections"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: fraud_detections
    ports:
      - "5433:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data

  writer:
    build: ./db_writer
    networks:
      - ml-scorer
    depends_on:
      database:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully 
    environment:
      POSTGRES_DB: "fraud_detections"
      POSTGRES_TABLE: "scores"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123456"
      POSTGRES_HOST: "database"
      POSTGRES_PORT: "5432"

      KAFKA_SCORING_TOPIC: "scoring"
      BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_SCORING_GROUP: "writers"

volumes:                
  postgres_data:
  
networks:
  ml-scorer:
    name: ml-scorer
    driver: bridge
    